services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: maggie_library
      POSTGRES_USER: maggie
      POSTGRES_PASSWORD: maggie
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggie -d maggie_library"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
